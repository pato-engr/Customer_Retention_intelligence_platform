app = "customer-retention-intelligence"
primary_region = "cdg"

[build]

[env]
  PORT = "5000"
  DATABASE_PATH = "/data/retention.db"
  MODEL_PATH = "/app/model/churn_pipeline.pkl"

[[mounts]]
  source = "retention_data"
  destination = "/data"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
